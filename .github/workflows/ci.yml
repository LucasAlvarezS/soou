name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: git identity (tests create throwaway repos)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: install as a package and smoke test
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          soou --version
          soou stats
          soou eval --generar 3
