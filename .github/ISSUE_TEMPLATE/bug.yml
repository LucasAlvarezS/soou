name: Bug
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. soou init
        2. soou ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and OS
      placeholder: "soou --version · Windows 11 / macOS 15 / Ubuntu 24.04 · Python 3.13"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Paste the relevant output. Remove anything private from your notes or sessions first.
      render: text
