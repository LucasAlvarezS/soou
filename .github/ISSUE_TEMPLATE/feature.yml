name: Idea
description: A feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the project
      options:
        - label: Works without adding runtime dependencies to the core (or keeps them optional)
        - label: Does not tie soou to a single vendor
